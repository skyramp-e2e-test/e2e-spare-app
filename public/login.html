<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - E2E Web App</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <nav>
    <a href="/" data-testid="nav-home">Home</a>
    <a href="/login" data-testid="nav-login">Login</a>
    <a href="/items" data-testid="nav-items">Items</a>
  </nav>
  <h1>Sign in</h1>
  <p class="hint" data-testid="login-hint">Use the test user from the README.</p>
  <p id="login-error" class="error" data-testid="login-error" hidden>Invalid email or password.</p>
  <form method="post" action="/login" data-testid="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required data-testid="email-input">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required data-testid="password-input">
    <button type="submit" data-testid="login-submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('login-error').hidden = false;
    }
  </script>
</body>
</html>
